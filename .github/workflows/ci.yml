name: CI

# ============================================================
# Purpose: Run linting, tests, and multi-platform builds on push/PR
# Triggers: push to main (Go files, go.mod, go.sum, workflow/script changes), pull requests to main
# Permissions: contents:read
# Inputs: None
# Outputs: Build artifacts uploaded as binaries, test coverage uploaded to Codecov
# Secrets: None
# Variables: None
# Preconditions: None
# ============================================================

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'
      - 'scripts/test.sh'
      - 'scripts/test.ps1'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      run: ./scripts/test.sh

    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: ./scripts/test.ps1
      shell: pwsh

    - name: Upload coverage to Codecov
      if: runner.os == 'Linux'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # GoReleaser needs full git history for version tags and changelog
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Run GoReleaser (snapshot)
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: '~> v2'
        args: build --snapshot --clean

    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: binaries
        path: dist/

name: Go Dependency Submission

# ============================================================
# Purpose: Submit Go module dependencies to GitHub's dependency graph for security analysis
# Triggers: push to main when go.mod changes
# Permissions: contents:write
# Inputs: None
# Outputs: Dependency graph submission to GitHub
# Secrets: None
# Variables: None
# Preconditions: None
# ============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'go.mod'

permissions:
  contents: write

jobs:
  go-dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run snapshot action
        uses: actions/go-dependency-submission@v2
        with:
          go-mod-path: go.mod

name: Release

# ============================================================
# Purpose: Build and publish releases with multi-platform binaries using GoReleaser
# Triggers: push of version tags (v*)
# Permissions: contents:write
# Inputs: None
# Outputs: GitHub release with multi-platform binaries, changelog
# Secrets: GITHUB_TOKEN (auto-provided)
# Variables: None
# Preconditions: None
# ============================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # GoReleaser needs full git history for version tags and changelog
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Run tests
      run: ./scripts/test.sh

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: '~> v2'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
